# Terbit metadata server ke registri MCP resmi. HANYA dipicu manual.
#
# Kenapa lewat Actions, bukan `mcp-publisher login github` di laptop:
# sejak registri v1.8.0 login interaktif memakai GitHub App yang tidak bisa
# membaca keanggotaan org, jadi namespace io.github.tiranyx/* tidak pernah
# diberikan kepada siapa pun — Owner sekalipun (modelcontextprotocol/registry
# #1468, #1483). Diukur 14 Sep 2026: token dari login itu hanya membawa
# io.github.fahmiwol/*.
#
# Login `github-oidc` memberi izin io.github.<pemilik repo>/* dari klaim token
# OIDC workflow ini (internal/api/handlers/v0/auth/github_oidc.go @ v1.8.1).
# Tidak ada token pribadi yang disimpan, ditempel, atau dikirim.
#
# Syarat: versi di server.json SUDAH terbit di npm dengan mcpName yang sama.
# Langkah "Cocokkan dengan npm" menolak jalan kalau belum.

name: Terbit ke registri MCP

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terbit-registri
  cancel-in-progress: false

jobs:
  terbit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MCP_PUBLISHER_VERSI: v1.8.1
      # Sidik resmi mcp-publisher_linux_amd64.tar.gz v1.8.1: sama dengan digest
      # aset GitHub dan registry_1.8.1_checksums.txt, yang tanda tangan
      # sigstore-nya diverifikasi 14 Sep 2026. Naikkan versi = ganti keduanya.
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - name: Ambil repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pasang mcp-publisher (sidik SHA-256 diperiksa)
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSI}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      - name: Cocokkan dengan npm
        run: |
          nama=$(jq -r .name server.json)
          versi=$(jq -r .version server.json)
          paket=$(jq -r '.packages[0].identifier' server.json)
          versi_paket=$(jq -r '.packages[0].version' server.json)
          if [ "$versi" != "$versi_paket" ]; then
            echo "::error::server.json version ($versi) != packages[0].version ($versi_paket)"; exit 1
          fi
          mcp=$(npm view "${paket}@${versi}" mcpName)
          if [ "$mcp" != "$nama" ]; then
            echo "::error::npm ${paket}@${versi} mcpName='${mcp}', server.json name='${nama}'"; exit 1
          fi
          echo "cocok: ${paket}@${versi} · mcpName ${mcp}"

      - name: Validasi
        run: ./mcp-publisher validate

      - name: Login OIDC
        run: ./mcp-publisher login github-oidc

      - name: Terbit
        run: ./mcp-publisher publish

      - name: Periksa di registri
        run: |
          nama=$(jq -r .name server.json)
          versi=$(jq -r .version server.json)
          for coba in 1 2 3 4 5 6; do
            if curl -fsSL "https://registry.modelcontextprotocol.io/v0.1/servers?search=${nama}" \
              | jq -e --arg n "$nama" --arg v "$versi" \
                '[.servers[]? | select(.server.name == $n and .server.version == $v)] | length > 0' >/dev/null; then
              echo "terlihat di registri: ${nama}@${versi}"; exit 0
            fi
            sleep 10
          done
          echo "::error::${nama}@${versi} belum terlihat di API registri sesudah 60 detik"; exit 1
